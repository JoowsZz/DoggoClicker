<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doggo Clicker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="./img/cachorro_pixel_1x.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game">
        <h1><img src="./img/logo doggo.png" alt="Doguinhologo" height="150"></h1>

       <p class="subtitle">O melhor amigo em 8 bits</p>
       <div class="goal-banner" id="goal-banner">
           <span class="goal-sparkle" aria-hidden="true">✨</span>
           <p>OBJETIVO: <strong id="goal-progress">1/20</strong> DOGUINHOS</p>
           <span class="goal-sparkle" aria-hidden="true">✨</span>
       </div>

       <section class="game-screen" aria-label="Jogo Doggo Clicker">
           <p class="population">População: <strong id="population">1</strong></p>
           <p class="instruction" id="game-message" aria-live="polite">Clique no doguinho para multiplicar!</p>
           <div class="dog-park" id="dog-park" aria-label="Doguinho">
               <div class="impact-particles" id="impact-particles" aria-hidden="true"></div>
               <button class="dog" type="button" aria-label="Doguinho, clique para duplicar">
                   <img src="img/cachorro_pixel_1x.png" alt="" draggable="false">
               </button>
           </div>
       </section>
       <p class="turbo-announcement" id="turbo-announcement" aria-live="assertive" hidden>
           MODO TURBO AU-AU 🔥
       </p>
       <div class="turbo-lightning" id="turbo-lightning" aria-hidden="true" hidden>
           <span class="turbo-lightning-flash"></span>
           <img class="turbo-lightning-bolt" alt="">
           <img class="turbo-lightning-bolt" alt="">
           <img class="turbo-lightning-bolt" alt="">
       </div>
       <div class="turbo-particles" id="turbo-particles" aria-hidden="true"></div>

       <button id="reset-button" class="utility-button" type="button">↻ Recomeçar</button>
       <div class="music-volume">
           <label for="music-volume">Música</label>
           <div class="volume-pot">
               <span class="volume-pot-indicator" aria-hidden="true"></span>
               <input id="music-volume" type="range" min="0" max="100" value="35"
                   aria-label="Volume da música" aria-valuetext="35%">
           </div>
           <output id="music-volume-value" for="music-volume">35%</output>
       </div>
       <button id="sound-button" class="utility-button" type="button" aria-pressed="true">🔊 Som: ligado</button>
       <audio id="background-music" src="assets/game-music.mp3" loop preload="none"></audio>

    </main>
    <dialog class="victory-dialog" id="victory-dialog" aria-labelledby="victory-title">
        <div class="victory-card">
            <span class="victory-confetti" aria-hidden="true">🎉 <img src="./img/cachorro_pixel_8x.png" alt="Doguinho" height="100"> 🎊</span>
            <p class="victory-eyebrow" id="victory-eyebrow">MISSÃO CUMPRIDA</p>
            <h2 id="victory-title">Você conseguiu!</h2>
            <p class="victory-message">Você reuniu <strong id="victory-goal">20 doguinhos</strong>!</p>
            <p class="victory-cheer" id="victory-cheer">Au au! Você é demais! 🐾</p>
            <button id="play-again-button" class="play-again-button" type="button">
                <span id="play-again-label">Jogar de novo</span>
            </button>
        </div>
    </dialog>
    <script src="script.js"></script>
    
</body>
</html>
